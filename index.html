<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kristina ❤️ Amrit</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:90%;
    max-width:450px;
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    color:#ff4f81;
    margin-bottom:10px;
}

p{
    color:#555;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    background:#ff4f81;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#e63d70;
}

#result{
    display:none;
}

.message{
    font-size:18px;
    line-height:1.8;
    color:#333;
}

.heart{
    font-size:55px;
    animation:beat 1s infinite;
}

@keyframes beat{
    50%{
        transform:scale(1.2);
    }
}
</style>

</head>
<body>

<div class="card" id="choose">
    <h1>❤️ Kristina & Amrit ❤️</h1>
    <p>Who are you?</p>

    <button onclick="showMessage('kristina')">I'm Kristina Thapa</button>
    <button onclick="showMessage('amrit')">I'm Amrit Chuwai</button>
</div>

<div class="card" id="result">
    <div class="heart">❤️</div>
    <h2 id="title"></h2>
    <p class="message" id="message"></p>

    <button onclick="location.reload()">Back</button>
</div>

<script>
function showMessage(person){

document.getElementById("choose").style.display="none";
document.getElementById("result").style.display="block";

if(person==="kristina"){

document.getElementById("title").innerHTML="Hi Kristina ❤️";

document.getElementById("message").innerHTML=
`No matter how many people I meet,
you'll always be my favorite person.
Thank you for making my life brighter every single day.
I love you endlessly. ❤️<br><br>
— Love, Amrit`;

}else{

document.getElementById("title").innerHTML="Hi Amrit ❤️";

document.getElementById("message").innerHTML=
`Every moment with you feels special.
Thank you for always caring for me,
making me smile, and standing beside me.
You'll always have a special place in my heart. ❤️<br><br>
— Love, Kristina`;

}

}
</script>

</body>
</html>
